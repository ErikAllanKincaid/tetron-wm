name = "latte"
# base = "midnight"   # unset fields inherit from this built-in
appearance = "light"

# The light side of cocoa: cream windows, tan paper desktop, peach focused
# title bar, dark chocolate text, burnt-orange accents. Its picture is
# latte.jpg (paper with a peach glow and faint broadcast arcs).
desktop_bg  = "#e6c9a6"
window_bg   = "#fbf1e6"
title_focus = "#ffb775"
title_blur  = "#ecdcc9"
title_fg    = "#3a1c13"
border      = "#b0906c"
shadow      = "#3a1c1333"
ctrl_fg     = "#594333"
close_fg    = "#b8441c"
menubar_bg  = "#f3e4d3"
dock_bg     = "#f3e4d3"
text        = "#2a1e14"
dim         = "#7a5c40"
accent      = "#8a4a10"
active_bg   = "#ffd9b3"
success     = "#3d7550"
error       = "#a8361a"
accent_fg   = "#fbf1e6"
icon_fg     = "#f7dfd1"   # labels sit on the dark desktop_scrim over the picture

# The 16 colours hosted apps see (ls --color, htop, git): deeper warm tones
# that read on cream.
[ansi]
black          = "#2a1e14"
red            = "#a8361a"
green          = "#4f7a3a"
yellow         = "#8a6100"
blue           = "#3f5f73"
magenta        = "#9c4a63"
cyan           = "#2f6f6a"
white          = "#a68a6d"
bright_black   = "#6b5340"
bright_red     = "#c2502a"
bright_green   = "#5f8f48"
bright_yellow  = "#a87810"
bright_blue    = "#55788c"
bright_magenta = "#b5607a"
bright_cyan    = "#3f8a84"
bright_white   = "#e6c9a6"

# 16-colour console (bare Linux VT): brown desktop and focused title, light
# grey windows and selection with black text.
[vt16]
desktop_bg  = 3
window_bg   = 7
title_focus = 3
title_fg    = 15
active_bg   = 6
text        = 0
