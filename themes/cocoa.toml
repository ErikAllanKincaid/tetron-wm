name = "cocoa"
# base = "midnight"   # unset fields inherit from this built-in
appearance = "dark"

# Warm browns: deep chocolate windows, burnt-orange focus and selection, peach
# accents, cream text. Its picture is cocoa.jpg (a warm glow with faint
# broadcast arcs).
desktop_bg  = "#2a1e14"
window_bg   = "#1d1109"
title_focus = "#723d08"
title_blur  = "#3a2a1d"
title_fg    = "#ffb775"
border      = "#594333"
shadow      = "#0a050280"
ctrl_fg     = "#e1c1ad"
close_fg    = "#e8673a"
menubar_bg  = "#2a1e14"
dock_bg     = "#2a1e14"
text        = "#f7dfd1"
dim         = "#b0906c"
accent      = "#ffb775"
active_bg   = "#723d08"
success     = "#a2c6ae"
error       = "#ff7a52"
accent_fg   = "#3a1c13"
icon_fg     = "#f7dfd1"

# The 16 colours hosted apps see (ls --color, htop, git): warm versions of each.
[ansi]
black          = "#2a1e14"
red            = "#e0644a"
green          = "#9fbf8a"
yellow         = "#f5c46a"
blue           = "#7f9aa8"
magenta        = "#d3869b"
cyan           = "#8fc4bf"
white          = "#e1c1ad"
bright_black   = "#6b5340"
bright_red     = "#ff8a63"
bright_green   = "#bcd6a8"
bright_yellow  = "#ffd78f"
bright_blue    = "#a7bfcc"
bright_magenta = "#e6a3b5"
bright_cyan    = "#b5e0db"
bright_white   = "#f7dfd1"

# 16-colour console (bare Linux VT): brown desktop and selection, black windows.
[vt16]
desktop_bg  = 3
window_bg   = 0
title_focus = 3
active_bg   = 3
title_fg    = 11
accent      = 11
