name = "contrast"
appearance = "dark"
wallpaper = "none"   # no picture: a plain black desktop

# High contrast: white on black everywhere. The focused title bar is grey, the
# inactive one black, and the menubar and dock are black; yellow marks buttons
# and the selection is blue. Every text pair is at least 7:1, so it reads well
# for low vision or a washed-out display. For a terminal with no colour at all,
# use colors = "mono" instead.

desktop_bg  = "#000000"
window_bg   = "#000000"
title_focus = "#4d4d4d"   # grey bar, white text
title_blur  = "#000000"   # black bar, white text, set off by the white border
title_fg    = "#ffffff"
border      = "#ffffff"
shadow      = "#00000000"
ctrl_fg     = "#ffffff"
close_fg    = "#ff5555"
menubar_bg  = "#000000"
dock_bg     = "#000000"
text        = "#ffffff"
dim         = "#b0b0b0"
accent      = "#ffff55"
active_bg   = "#0000aa"
