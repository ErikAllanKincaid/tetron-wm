## tetron-wm configuration: copy to ~/.config/tetron-wm/config.toml
##
## Every option with a real default is set here to that DEFAULT, so this file can
## be dropped in as is and changes nothing. Edit a value to override it.
## Options with no default (unset = automatic) are shown commented out: uncomment
## and edit to use them. Most edits apply on `tetron-wm reload` (apps keep
## running); the few that need more say so. Settings changed in the in-app
## Settings window are written back to this file.
##
## TOML rule: plain `key = value` lines must come BEFORE any [table] or [[array]]
## header, so those are all at the bottom.
##
## Full explanations: docs/CONFIG.md and `tetron-wm --help`.

## ── Window behavior ───────────────────────────────────────────────────────
## Drag a window to a screen edge to snap it there.
snapping_enabled = false
## Distance in cells from the edge that triggers a snap (1-10). Only matters when
## snapping_enabled = true.
snap_threshold = 3
## Draw drop shadows behind windows.
window_shadows = false
## "Natural" scrolling: wheel/touchpad down goes back into history. Set false for
## traditional scrolling. Does not affect Shift+PageUp/PageDown.
natural_scroll = true
## Open new app windows maximized (filling the work area).
launch_maximized = false
fullscreen = true

## ── Tiling ────────────────────────────────────────────────────────────────
## Auto-arrange all windows into the tiling grid as they open and close.
auto_tile = false
## Tiling grid size (each 1-6). Used by auto-tile, tile, and "send to cell".
## Example: a 1x3 grid gives three side-by-side columns on an ultrawide screen.
grid_rows = 2
grid_cols = 2
## Cells of gutter between tiled windows.
tile_gap = 0

## ── Appearance ────────────────────────────────────────────────────────────
## Color theme: a built-in (midnight, gruvbox, pastoral, windows) or the stem of
## a theme file in the themes dir (nord, dracula, dawn, newmoon and contrast come
## with the suite installer's extra themes). A file named like a built-in
## overrides it. Create a starter with: tetron-wm theme --dump <name>
## (list all: tetron-wm theme --list)
theme = "midnight"
## Directory of *.toml theme files. Unset = <config dir>/themes/. A relative path
## resolves against the config dir.
#theme_dir = "themes"
## Terminal default background/foreground, independent of the desktop theme (hex
## #rrggbb or a named color). Unset = follow the theme (pastoral gives black on
## white terminals). Example: a light desktop with dark terminals. Needs
## `tetron-wm kill` then relaunch (the apphost reads them at startup).
#terminal_bg = "#1a1a1a"
#terminal_fg = "#e0e0e0"
## Scrollback lines kept per app window (0 to 100000). The main memory cost of
## a busy window. Applies to
## windows opened after the change.
#scrollback = 10000
## Force 24-bit truecolor output on/off. Unset = auto-detect. Set true when your
## terminal supports truecolor but does not set COLORTERM (common with
## TERM=xterm-256color), else nord/dracula look washed out. Env override:
## TETRON_WM_TRUECOLOR=1/0. For fewer colors use the env var
## TETRON_WM_COLORS=mono|16|256 (auto: the kernel console TERM=linux gets 16,
## NO_COLOR or a vt100-class TERM gets black and white).
#truecolor = true
## Icon and symbol glyphs where the graphical (Kitty) icons can not render
## (kmscon, a bare VT, plain SSH): "auto" (ascii on a bare console, unicode
## elsewhere), "ascii" (every font, kernel console included), "unicode"
## (DejaVu Sans Mono symbols, kmscon and GUI terminals), "nerd" (needs a Nerd
## Font), or "emoji".
icon_style = "auto"
## Text of the menubar launcher button: up to 6 characters (centred), or
## "@session" to show the session name in a named session.
launcher_label = "tetron"

## ── Wallpaper ─────────────────────────────────────────────────────────────
## Desktop wallpaper: "default" (the theme's own picture; empty means the same),
## "black", a "#rrggbb" colour, "none" (the theme's desktop colour), an absolute
## path, a ~-path, or a name looked up in ~/.config/tetron-wm/themes/ (then the
## config dir). Anything but "default" is your own pick and stays when you change
## theme. Quotes, file:// URLs and $HOME are accepted. A missing file shows the
## theme's picture (logged, and noted in Settings). Pictures are drawn as colored
## cells with `chafa` (needs it installed; falls back to a solid desktop), and
## below 256 colors "default" is the theme's desktop colour. A theme file X.toml
## brings X.jpg (or png, webp) from the same folder, or the file its own
## `wallpaper` key names. Env override: TETRON_WM_WALLPAPER.
wallpaper = "default"
## Master switch. false = solid desktop (theme desktop_bg) even if wallpaper is set.
wallpaper_enabled = true
## Color depth: "auto" (what the terminal reports), "mono" (black and white),
## "16", "256" or "truecolor". Settings > Appearance > Colors switches it live.
## TETRON_WM_COLORS overrides it.
colors = "auto"
## Chromecast for the right-click "Cast to Chromecast" (video, audio, images; needs
## catt installed): a device name or IP, as catt -d takes it. "" = catt's default.
cast_device = ""
## Image viewer: "auto" (Kitty graphics when the terminal has them, never on a
## bare console; otherwise colored cells via chafa, or half blocks without it),
## "graphics", or "cells". In the viewer, m switches for that window.
image_viewer = "auto"

## ── Desktop icons ─────────────────────────────────────────────────────────
## Show icons on the desktop (the contents of ~/Desktop plus [[desktop_pins]]).
desktop_enabled = true
## Backdrop behind icon labels when a wallpaper is shown, for legibility: a color
## (#rrggbb, #rrggbbaa, or a name), or "none" to draw labels straight on the
## image. Unset = semi-transparent black (#000000c8).
#desktop_scrim = "#00000080"

## ── Files and working directories ─────────────────────────────────────────
## Directory the working-directory picker opens at. Unset = your home.
#default_project_dir = "/home/you/code"
## Show hidden (dot) directories in the picker by default.
show_hidden_dirs = false
## File-manager view: "icon" or "list". Accepted and saved, but not applied at
## startup yet (list is always the default).
#filemanager_view = "list"

## ── Assistant (the ✦ panel) ───────────────────────────────────────────────
## Agent CLI the assistant runs: "opencode" (default when unset) or "hermes", or
## any binary or wrapper script.
#assistant_command = "opencode"
## Extra arguments for the assistant CLI.
assistant_args = []
## How it opens: "panel" (right-docked) or "window" (floating).
assistant_mode = "panel"

## ── Updates ───────────────────────────────────────────────────────────────
## Branch the in-app updater tracks: "main" (stable prebuilt releases) or "dev"
## (built from source, for testing).
update_branch = "main"

## ── Web ───────────────────────────────────────────────────────────────────
## Start page for text web browsers launched without a URL (w3m exits at once
## without one). Empty = launch them bare. Example: web_home = "https://wiki.archlinux.org"
web_home = "https://lite.duckduckgo.com/lite/"

## ── Screensaver and screenshots ───────────────────────────────────────────
## Effect used by `tetron-wm screensaver` and leader z when none is named:
## "black" or "clock" (list: tetron-wm screensaver list). On demand only, there
## is no idle timer; any key or mouse event wakes it.
screensaver = "black"
## Where screenshots (leader s / launcher Screenshot) go. Empty = ~/Pictures if it
## exists, else $HOME.
screenshot_dir = ""

## ── Power ─────────────────────────────────────────────────────────────────
## Show launcher > Power (Suspend / Reboot / Power off). Set false on machines
## that must never be shut down from here (remote servers): the actions are then
## refused everywhere, not just hidden. Custom commands: see [power_commands].
power_menu = true

## ── Keys ──────────────────────────────────────────────────────────────────
## Leader chord, ctrl+<key>. Needs `tetron-wm reload`. Never pick a key a
## terminal needs (ctrl+c, ctrl+d, ctrl+z ...). Example: leader = "ctrl+b"
#leader = "ctrl+space"
## Per-action remaps live in the [keys] table at the bottom.

## ── Clipboard history ─────────────────────────────────────────────────────
## Browse it from the menubar clipboard segment or leader C.
clipboard_history = true            # record everything copied
clipboard_persist = true            # save to ~/.local/share/tetron-wm (mode 0600); false = memory only
clipboard_record_selection = true   # also record plain mouse selections
clipboard_history_size = 100        # max unpinned entries
clipboard_item_max_kb = 256         # larger entries are not recorded
clipboard_ttl_secs = 0              # expire unpinned entries after N seconds (0 = never)
clipboard_shims = "auto"            # xclip/xsel/wl-copy/wl-paste shims for launched apps: auto (no display only) | on | off
clipboard_fake_display = false      # dummy WAYLAND_DISPLAY so Neovim uses the shims (side effect: apps think a desktop exists)
clipboard_gui_bridge = "auto"       # mirror the real X11/Wayland clipboard: auto (when a display exists) | on | off
clipboard_osc52_read = "focused"    # who may read the clipboard via OSC 52: focused | always | never
## Do not record copies made while an app whose name or command contains one of
## these (case-insensitive) is focused. Example for password managers:
## clipboard_ignore_apps = ["keepassxc", "pass", "bitwarden"]
clipboard_ignore_apps = []


## ══ Tables and lists. Everything below must stay at the end of the file. ═════

## ── Leader key remaps ─────────────────────────────────────────────────────
## Press the leader chord, then the key. A value is one key or a list; a key is a
## single character or space, enter, tab, backtab (Shift+Tab), esc, left, right,
## up, down, backspace.
## Setting an action REPLACES its default keys. Defaults shown (all of them):
[keys]
spotlight   = "space"
launcher    = ["l", "enter"]
maximize    = ["m", "M"]
minimize    = ["n", "N"]
focus_next  = "tab"
focus_prev  = "backtab"
windows     = "f"
move        = "w"
volume      = "="
close       = "esc"
snap_left   = ["[", "left"]
snap_right  = ["]", "right"]
store       = "S"
settings    = ","
activity    = "A"
clipboard   = "C"
select      = ["x", "y"]
copy        = "c"
paste       = ["v", "p"]
help        = ["?", "h"]
rename      = ["r", "R"]
tile        = "t"
info        = "i"
context_menu = "."
auto_tile   = "T"
screensaver = "z"
screenshot  = "s"
detach      = "q"
shutdown    = "Q"

## ── Status segments (menubar tray) ────────────────────────────────────────
## Where each segment lives: "bar" (always on the bar), "info" (in the (i) menu)
## or "auto" (on the bar, overflowing into the (i) menu when space runs out).
## Keys: cpu, mem, battery, bluetooth, wifi, tetron, bell. Defaults shown. A CPU
## or memory reading of 90% or more shows on the bar anyway.
[tray_placement]
cpu       = "info"
mem       = "info"
bluetooth = "info"
battery   = "auto"
wifi      = "auto"
tetron    = "auto"
bell      = "auto"

## ── Tray "Open <tool>" rows ───────────────────────────────────────────────
## Per item (cpu, mem, battery, bluetooth, network, volume): a command line or
## an ordered list; the first whose program is installed wins. A "hold:" prefix
## runs it via sh -c and keeps the window open until Enter. An empty list
## removes the row.
## Defaults are built in; uncomment to override, e.g. prefer btop and hide memory:
[tray_tools]
#cpu = ["btop", "htop", "top"]
#battery = ["jolt", "hold:upower -i $(upower -e | grep -m1 -i bat)"]
#bluetooth = "bluetuith"
#network = "nmtui"
#volume = ["pulsemixer", "alsamixer"]
#mem = []

## ── Power commands ────────────────────────────────────────────────────────
## Per action (suspend, reboot, poweroff): a command line or a list tried in
## order until one succeeds. Replaces the built-in chain (systemd, elogind,
## sudo/doas, busybox). An empty list hides the action. Unset = built-in chain.
[power_commands]
#suspend = "systemctl suspend"
#reboot = ["systemctl reboot", "sudo reboot"]
#poweroff = ["doas poweroff", "sudo poweroff"]

## ── Taskbar badge colors ──────────────────────────────────────────────────
## Keyword (case-insensitive substring of the app name or command) -> color
## (a name or #rrggbb), shown on the taskbar pill. Defaults shown; add more.
[dock_badges]
claude = "orange"
kilo = "yellow"
#htop = "#00cc66"

## ── Default apps ("open with") ────────────────────────────────────────────
## Role -> handler command used when opening files. Roles: image, directory,
## text, code, audio, video, archive, pdf, other, plus editor and terminal for
## shortcuts. Special handlers: @image (built-in viewer), @navigate (open in the
## file manager). Unset roles show an Open-with menu. If you uncomment this table
## it REPLACES the built-in map, so list every role you want. Built-in defaults:
## image = "@image", directory = "@navigate", text/code/editor = $EDITOR (else
## vi), terminal = $SHELL (else bash).
#[default_apps]
#image = "@image"
#directory = "@navigate"
#text = "hx"
#code = "hx"
#editor = "hx"
#terminal = "zsh"
#video = "mpv"
#audio = "mpv"
#pdf = "zathura"

## ── Extra "Open with…" programs ────────────────────────────────────────────
## Per role, extra programs for the right-click Open with... menu. They are
## always listed (installed or not), after the ones tetron-wm detects; the file
## path is added as the last argument. Roles as above. Also shown in Settings >
## Default Apps.
#[open_with]
#video = ["casttui"]
#audio = ["casttui"]

## ── Apps auto-started at launch ───────────────────────────────────────────
## Each [[apps]] entry opens a window at launch and appears in the taskbar.
## Default: none (launch from the menu or desktop). Entry fields (the same for
## [[launcher]] and [[desktop_pins]]):
##   name         label for the titlebar / taskbar / menu
##   command      executable (from $PATH), or a built-in: @files, @store
##   args         list of arguments
##   category     launcher grouping (default "Apps")
##   cwd          fixed start directory (skips the picker)
##   requires_cwd true = ask for a working directory on launch
##   cli          true = a one-shot CLI tool: run via a shell so its output stays
##                visible instead of the window vanishing
##   warn         confirmation text shown before launching
## Example: a shell and htop at every start.
#[[apps]]
#name = "Shell"
#command = "bash"
#
#[[apps]]
#name = "htop"
#command = "htop"

## ── Launcher menu ─────────────────────────────────────────────────────────
## Apps offered in the launcher menu and spotlight. If none are listed, the
## launcher falls back to the [[apps]] list. The 600+ app catalog is always
## available through the Store; these are your own extras.
#[[launcher]]
#name = "Neovim in project"
#command = "nvim"
#category = "Editors"
#requires_cwd = true
#
#[[launcher]]
#name = "Logs"
#command = "journalctl"
#args = ["-f"]
#category = "System"
#cli = true
#
#[[launcher]]
#name = "Wipe cache"
#command = "rm"
#args = ["-rf", "/home/you/.cache/thing"]
#category = "System"
#cli = true
#warn = "This deletes the cache. Continue?"

## ── Desktop shortcuts ─────────────────────────────────────────────────────
## Pinned icons on the desktop, shown alongside the real contents of ~/Desktop.
## Default: none.
#[[desktop_pins]]
#name = "Files"
#command = "@files"
#
#[[desktop_pins]]
#name = "Store"
#command = "@store"
