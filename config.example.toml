# tetron-wm configuration — ~/.config/tetron-wm/config.toml
#
# Every option is shown with its DEFAULT value and left commented out: with no
# config file at all, these exact defaults apply, so you only need a config.toml
# to change something. Uncomment a line and edit it to override.
#
# Full explanations: docs/CONFIG.md.

## ── Window behavior ───────────────────────────────────────────────────────
# Drag a window to a screen edge to snap it there. (default: off.)
#snapping_enabled = false
# Distance in cells from the edge that triggers a snap (1–10). Only matters when
# snapping_enabled = true.
#snap_threshold = 3
# Draw drop shadows behind windows. (default: off.)
#window_shadows = false
# Scroll direction ("natural"): scrolling down goes back into history.
# Wheel/touchpad only; does not affect Shift+PageUp/PageDown. (default: on.)
# Set false for traditional scrolling (wheel up = back into history).
#natural_scroll = true
# Open new app windows maximized (filling the work area).
#launch_maximized = false

## ── Tiling ────────────────────────────────────────────────────────────────
# Auto-arrange all windows into the tiling grid as they open/close.
#auto_tile = false
# Tiling grid size (each 1–6). Used by auto-tile and "send to cell".
#grid_rows = 2
#grid_cols = 2
# Cells of gutter between tiled windows.
#tile_gap = 0

## ── Appearance ────────────────────────────────────────────────────────────
# Color theme: a built-in ("newmoon", "midnight", "nord", "gruvbox", "dracula", "pastoral";
# default: newmoon) or the stem of a theme file in the themes dir (below). A
# file with a built-in's name overrides that built-in.
#theme = "newmoon"
# Directory of *.toml theme files. Unset = <config>/themes/ (i.e.
# ~/.config/tetron-wm/themes/). Relative paths resolve against the config dir.
# Create a starter with: tetron-wm theme --dump <name>   (list all: --list)
#theme_dir = "themes"
# Terminal default background/foreground, independent of the desktop theme (hex
# #rrggbb or a named color). Unset = follow the theme (e.g. "pastoral" gives
# black-on-white terminals). Set these to decouple the terminal, e.g. a light
# desktop with a dark terminal. Applied by the apphost at startup, so a change
# takes effect on the next start (`tetron-wm kill` then relaunch), not a reload.
#terminal_bg = "#ffffff"
#terminal_fg = "#1a1a1a"
# Force 24-bit "truecolor" output on/off. Unset = auto-detect (known truecolor
# terminals + COLORTERM). Set true if your terminal does truecolor but does not
# set COLORTERM (common with TERM=xterm-256color), otherwise subtle themes
# (nord, dracula) get quantized to the 256-color palette and look wrong. The
# TETRON_WM_TRUECOLOR=1/0 env var overrides this key.
#truecolor = true
# File-type icon glyphs where the graphical (Kitty) icons can't render -- kmscon,
# a bare VT, plain SSH: "ascii" (default; BMP geometric shapes, render in every
# font and take the theme color), "nerd" (Nerd Font file-type glyphs -- needs a
# Nerd Font installed, which tetron-os ships), or "emoji" (GUI terminals only).
#icon_style = "ascii"

## ── Files / working directories ───────────────────────────────────────────
# Directory the working-directory picker opens at (default: your home).
#default_project_dir = "/home/you"
# Show hidden (dot) directories in the picker by default.
#show_hidden_dirs = false
# File-manager view: "icon" or "list". Default is list. (This override key
# round-trips but is not yet applied at startup -- list is always the default.)
#filemanager_view = "list"
# recent_dirs is maintained by the app (most-recent working dirs); not hand-set.
#recent_dirs = []

## ── Desktop ───────────────────────────────────────────────────────────────
# Show icons on the wallpaper/desktop.
#desktop_enabled = true
# Pinned desktop shortcuts (see [[desktop_pins]] below). Default: none — the
# desktop shows only the real contents of ~/Desktop. Add pins explicitly.
# desktop_positions (icon grid placement) is saved by the app, not hand-set.

## ── Assistant (the ✦ panel) ───────────────────────────────────────────────
# Agent CLI the assistant runs (default: opencode).
#assistant_command = "opencode"
# Extra arguments for the assistant CLI.
#assistant_args = []
# How it opens: "panel" (right-docked) or "window" (floating).
#assistant_mode = "panel"

## ── Updates ───────────────────────────────────────────────────────────────
# Branch the in-app updater tracks: "main" (stable prebuilt) or "dev".
#update_branch = "main"

## ── Web ───────────────────────────────────────────────────────────────────
# Start page for text browsers launched without a URL (w3m exits at once
# without one). Empty = launch them bare.
#web_home = "https://lite.duckduckgo.com/lite/"

## ── Keys ──────────────────────────────────────────────────────────────────
# Leader chord, ctrl+<key> (needs `tetron-wm reload`). Default ctrl+space.
#leader = "ctrl+space"
# Leader remaps per action: one key or a list. Actions and defaults: tetron-wm --help
#[keys]
#launcher = ["a", "l", "enter"]

## ── Clipboard history ─────────────────────────────────────────────────────
#clipboard_history = true            # record everything copied
#clipboard_persist = true            # save to ~/.local/share/tetron-wm (mode 0600)
#clipboard_record_selection = true   # record mouse selections
#clipboard_history_size = 100
#clipboard_item_max_kb = 256
#clipboard_shims = "auto"            # xclip/xsel/wl-copy/wl-paste shims: auto | on | off
#clipboard_fake_display = false      # dummy WAYLAND_DISPLAY so Neovim uses the shims
#clipboard_gui_bridge = "auto"       # mirror the X11/Wayland clipboard: auto | on | off
#clipboard_osc52_read = "focused"    # who may read via OSC 52: focused | always | never
#clipboard_ignore_apps = []          # do not record while these apps are focused
#clipboard_ttl_secs = 0              # expire unpinned entries (0 = never)

## ── Apps, launcher, taskbar ───────────────────────────────────────────────
# Apps auto-started at launch and shown in the taskbar. Each entry is a table.
# Fields: name (titlebar/taskbar label), command (executable), args (list),
# category (launcher grouping), requires_cwd (bool), cwd (start dir),
# cli (bool: wrap a CLI tool so it doesn't exit instantly), warn (confirm text).
#[[apps]]
#name = "Shell"
#command = "bash"
#args = []

# Apps offered in the launcher menu / spotlight. If empty, the launcher falls
# back to the `apps` list above. Same entry fields as [[apps]].
#[[launcher]]
#name = "htop"
#command = "htop"
#cli = true

# Pinned desktop shortcuts (same fields as [[apps]]). Default: none.
#[[desktop_pins]]
#name = "Files"
#command = "@files"

# File-role → handler map for "open with" (role name = handler command).
#[default_apps]
#text = "hx"
#image = "chafa"

# Per-app badge colors (shown on the taskbar pill): keyword (case-insensitive
# substring of the app name/command) → color (a named color or #rrggbb).
# Default: claude=orange, kilo=yellow.
#[dock_badges]
#claude = "orange"
#kilo = "yellow"

# Tray popover "Open ..." rows. Per item (cpu, mem, battery, bluetooth, network): a command
# line or an ordered list; the first whose program is installed wins. A "hold:"
# prefix runs it via sh -c and keeps the window open until Enter. [] removes the row.
#[tray_tools]
#cpu = ["btop", "htop", "top"]
#battery = ["jolt", "hold:upower -i $(upower -e | grep -m1 -i bat)"]
#bluetooth = "bluetuith"
#network = "nmtui"
#mem = []
