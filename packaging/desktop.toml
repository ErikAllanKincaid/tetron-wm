# tetron-wm-desktop: a metapackage for mkdeb (no binary, Architecture all).
# Built once per release by the build-deb action. Spec: spec/packaging.py (WMDEB-007).
#
# `apt install tetron-wm-desktop` installs tetron-wm plus the tools its
# features use, because apt installs Recommends by default. The lists follow
# USER's review (DO-NOT-COMMIT/LIST_tetron-wm_deb_default_packages_review.md,
# 2026-10-31). Each name exists in Debian 12 and 13 and Ubuntu 22.04 and 24.04.
# Tools Debian does not package (carbonyl, fresh, casttui, catt, uv, opencode,
# a symbols Nerd Font) stay with install-tetron-wm-suite.sh.
name = "tetron-wm-desktop"
description = "tetron-wm with the tools its features use"
long_description = """
Installs tetron-wm together with the programs that its features call:
image wallpapers and previews (chafa), video and audio (mpv), PDF pages
(poppler-utils), a text web browser (w3m), the CPU monitor the tray opens
(htop), battery status (upower), the console mouse (gpm), clipboard sync
(xclip, wl-clipboard), sound (alsa-utils), remote systems and their files
(openssh-client, sshpass, sshfs), archives (7zip, unzip), encryption
(gnupg), Start Page and AI Mode (python3), updates and theme downloads
(curl), console fonts for screenshots (console-setup-linux), a file manager
(mc), an editor (vim) and fonts-dejavu-core.

Each is a Recommends, so it can be removed later without removing this
package. System services (PipeWire, NetworkManager, BlueZ, an SSH server)
and kmscon are only suggested: installing this package never starts a
network service."""
section = "metapackages"
license = "MIT"
homepage = "https://github.com/ErikAllanKincaid/tetron-wm"
depends = ["tetron-wm (>= {minor})"]
recommends = [
  "mpv", "chafa", "poppler-utils", "upower", "w3m", "gpm",
  "xclip", "wl-clipboard", "alsa-utils", "sshpass", "fonts-dejavu-core",
  "7zip | p7zip-full", "gnupg",
  "python3", "curl", "openssh-client", "unzip", "console-setup-linux",
  "htop", "sshfs", "mc", "vim",
]
# kmscon (>= 9.1): Debian 12 ships 9.0.0, without truecolor and mouse passthrough.
# openssh-server stays a Suggests (USER review): Debian starts the SSH server
# on install, which must never happen just because this package was installed.
suggests = [
  "btop", "age",
  "pipewire", "wireplumber", "network-manager", "bluez", "kmscon (>= 9.1)",
  "openssh-server", "openssh-sftp-server",
]
files = []
