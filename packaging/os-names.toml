# Per-OS package names for the app sets (WMINST-001). The sets themselves are
# packaging/desktop.toml and packaging/extras.toml (Debian names); this file
# says how to find each one on the other systems the suite script supports.
# scripts/gen_suite_lists.py combines them into assets/suite-apps.txt.
#
# [app.<debian-name>]
#   check   what tells the app is present: a command on PATH, "font=NAME"
#           (fontconfig), or "consolefonts" (a console font directory).
#           Alternatives with "|", for example "7z|7zz".
#   dnf, pacman, brew   the name there; missing = the Debian name; "" = not
#           on that system. One unknown name makes dnf refuse the whole batch,
#           so every name here was checked: Fedora and Arch in containers,
#           Homebrew against formulae.brew.sh (2026-10-31).
#   group   "gui": only on a machine with a desktop session; "services": the
#           suite script's separate, default-no services question.
#   size, apt   only for an entry in no deb: its size, and apt = "".

[app.mpv]
check = "mpv"

[app.chafa]
check = "chafa"

[app.poppler-utils]
check = "pdftoppm"
pacman = "poppler"
brew = "poppler"

[app.upower]
check = "upower"
brew = ""

[app.w3m]
check = "w3m"

[app.gpm]
check = "gpm"
brew = ""

[app.xclip]
check = "xclip"
group = "gui"
brew = ""

[app.wl-clipboard]
check = "wl-copy"
group = "gui"
brew = ""

[app.alsa-utils]
check = "alsamixer"
brew = ""

[app.sshpass]
check = "sshpass"

[app.fonts-dejavu-core]
check = "font=DejaVu Sans Mono"
dnf = "dejavu-sans-mono-fonts"
pacman = "ttf-dejavu"
brew = ""

[app.7zip]
check = "7z|7zz"
brew = "sevenzip"

[app.gnupg]
check = "gpg"
dnf = "gnupg2"

[app.python3]
check = "python3"
pacman = "python"
brew = ""

[app.curl]
check = "curl"
brew = ""

[app.openssh-client]
check = "ssh"
dnf = "openssh-clients"
pacman = "openssh"
brew = ""

[app.unzip]
check = "unzip"
brew = ""

[app.console-setup-linux]
check = "consolefonts"
dnf = "kbd"
pacman = "kbd"
brew = ""

[app.htop]
check = "htop"

[app.sshfs]
check = "sshfs"
dnf = "fuse-sshfs"
brew = ""

[app.mc]
check = "mc"
brew = "midnight-commander"

[app.vim]
check = "vim"
dnf = "vim-enhanced"

[app.fbi]
check = "fbi"
dnf = "fbida"
pacman = "fbida"
brew = ""

[app.git]
check = "git"

# In no deb: packaged on some systems only.
[app.uv]
check = "uv"
size = "desktop"
apt = ""
# Debian and Ubuntu: no package; the suite script runs uv's own installer.

[app.blueutil]
check = "blueutil"
size = "desktop"
apt = ""
dnf = ""
pacman = ""
# macOS Bluetooth control.

# Services: Suggests of tetron-wm-desktop, offered by the suite script as a
# separate question that defaults to no.
[app.wireplumber]
check = "wpctl"
group = "services"
brew = ""

[app.network-manager]
check = "nmcli"
group = "services"
dnf = "NetworkManager"
pacman = "networkmanager"
brew = ""

[app.bluez]
check = "bluetoothctl"
group = "services"
pacman = "bluez-utils"
brew = ""
